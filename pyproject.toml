[project]
name = "arete"
version = "0.3.0"
description = "Turn a flat list into a MindNode mind map, via OPML import"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
arete = "arete.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arete"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
